<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420">
<style>
.box{fill:#F5F7FA;stroke:#334155;stroke-width:2;rx:12;ry:12}
.contract{fill:#E6F4FF;stroke:#0369A1;stroke-width:2;rx:12;ry:12}
.pipeline{fill:#F0E9FF;stroke:#6D28D9;stroke-width:2;rx:12;ry:12}
.success{fill:#E6F9EC;stroke:#15803D;stroke-width:2;rx:12;ry:12}
.text{font-family:Inter,Segoe UI,Arial;font-size:16px;fill:#0F172A;text-anchor:middle;dominant-baseline:middle}
.title{font-family:Inter,Segoe UI,Arial;font-size:24px;fill:#0F172A;text-anchor:middle}
.label{font-family:Inter,Segoe UI,Arial;font-size:14px;fill:#334155;text-anchor:middle}
.line{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
</marker>
</defs>

<rect class="box" x="120" y="170" width="200" height="80"/>
<text class="text" x="220" y="210">Feature Branch</text>

<rect class="contract" x="380" y="170" width="220" height="80"/>
<text class="text" x="490" y="210">Contract Change</text>

<rect class="pipeline" x="660" y="170" width="220" height="80"/>
<text class="text" x="770" y="210">Consumer Tests</text>

<rect class="success" x="920" y="170" width="180" height="80"/>
<text class="text" x="1010" y="210">Safe Merge</text>

<line class="line" x1="320" y1="210" x2="380" y2="210"/>
<line class="line" x1="600" y1="210" x2="660" y2="210"/>
<line class="line" x1="880" y1="210" x2="920" y2="210"/>
</svg>