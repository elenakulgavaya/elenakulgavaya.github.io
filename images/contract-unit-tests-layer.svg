<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420">
<style>
.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:10;ry:10}
.contract{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:10;ry:10}
.pipeline{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:10;ry:10}
.text{font-family:Inter,Segoe UI,Arial;font-size:16px;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
.label{font-family:Inter,Segoe UI,Arial;font-size:14px;fill:#334155;text-anchor:middle}
.line{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
</marker>
</defs>

<rect class="box" x="340" y="300" width="220" height="70"/><text class="text" x="450" y="335">Unit Tests</text>
<rect class="box" x="300" y="200" width="300" height="70"/><text class="text" x="450" y="235">Component Tests</text>
<rect class="contract" x="240" y="100" width="420" height="70"/><text class="text" x="450" y="135">Contract Tests</text>
</svg>