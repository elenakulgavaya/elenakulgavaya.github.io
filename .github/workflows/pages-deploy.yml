name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Generate booking data
        env:
          BOOKING_CODES: ${{ secrets.BOOKING_CODES }}
          CALENDLY_URL: ${{ secrets.CALENDLY_URL }}
        run: |
          cat > /tmp/gen_booking.mjs << 'EOF'
          import { writeFileSync } from 'fs';
          const codes = process.env.BOOKING_CODES.split(',').map(c => c.trim()).filter(Boolean);
          const url   = process.env.CALENDLY_URL;
          const enc   = new TextEncoder();
          async function encrypt(code) {
            const keyBytes = await crypto.subtle.digest('SHA-256', enc.encode(code));
            const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['encrypt']);
            const iv  = crypto.getRandomValues(new Uint8Array(12));
            const ct  = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(url));
            const out = new Uint8Array(12 + ct.byteLength);
            out.set(iv); out.set(new Uint8Array(ct), 12);
            return Buffer.from(out).toString('base64');
          }
          const blobs = await Promise.all(codes.map(encrypt));
          writeFileSync('_data/booking.yml', 'encrypted_urls:\n' + blobs.map(b => `  - ${b}`).join('\n') + '\n');
          EOF
          node /tmp/gen_booking.mjs

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
