{% if page.layout == 'tag' or page.layout == 'category' %}
  <meta name="robots" content="noindex, follow">
{% endif %}

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1e">

<!-- Fonts: Newsreader + Space Grotesk + JetBrains Mono (sidebar/home) + IBM Plex (posts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/sidebar-editorial.css' | relative_url }}">

{% if page.layout == 'home' %}
  <link rel="stylesheet" href="{{ '/assets/css/home-editorial.css' | relative_url }}">
{% endif %}

{% if page.layout == 'post' %}
  <link rel="stylesheet" href="{{ '/assets/css/post-editorial.css' | relative_url }}">
  <style>
    /* Re-enable TOC panel for posts */
    #panel-wrapper { display: block !important; }
  </style>
{% endif %}
